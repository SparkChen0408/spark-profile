<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the 'Neon Light delay boom button'</title>
</head>
<body>
    <a href="#">
        <span></span>

        Neon Light

<style>
    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color:#012321;
        font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }
    a {
        position: relative;
        color: #0bf7f3;
        text-decoration: none;
        letter-spacing: 3px;
        padding: 15px 20px;
        transition: 0.25s;
        transition-delay: 1s;
        overflow: hidden;
        border-radius: 5px;
    }
    a:hover {
        background-color: #0bf7f3;
        color: #012321;
        box-shadow: 0 0 10px #0bf7f3, 0 0 40px #0bf7f3, 0 0 80px #0bf7f3;
    }
    a span{
        position: absolute;
    }
    a span:nth-child(1){
        top: 0;
        left: -100%;
        height: 2px;
        width: 100%;
        background: linear-gradient(90deg, transparent, #0bf7f3);
        transition: 1s;
    }
    a:hover span:nth-child(1){
        top: 0;
        left: 100%;
        height: 2px;
        width: 100%;
        background: linear-gradient(90deg, transparent, #0bf7f3);
        transition: 1s;
    }
    a span:nth-child(2){
        right: 0;
        top: -100%;
        height: 100%;
        width: 2px;
        background: linear-gradient(180deg, transparent, #0bf7f3);
        transition: 1s;
    }
    a:hover span:nth-child(2){
        right: 0;
        top: 100%;
        height: 100%;
        width: 2px;
        background: linear-gradient(180deg, transparent, #0bf7f3);
        transition: 1s;
        transition-delay: 0.25s;
    }
    a span:nth-child(3){
        bottom: 0;
        right: -100%;
        height: 2px;
        width: 100%;
        background: linear-gradient(270deg, transparent, #0bf7f3);
        transition: 1s;
    }
    a:hover span:nth-child(3){
        bottom: 0;
        right: 100%;
        height: 2px;
        width: 100%;
        background: linear-gradient(270deg, transparent, #0bf7f3);
        transition: 1s;
        transition-delay: 0.5s;
    }
    a span:nth-child(4){
        bottom: -100%;
        left: 0;
        height: 100%;
        width: 2px;
        background: linear-gradient(360deg, transparent, #0bf7f3);
        transition: 1s;
    }
    a:hover span:nth-child(4){

        left: 0;
        height: 100%;
        width: 2px;
        background: linear-gradient(360deg, transparent, #0bf7f3);
        transition: 1s;
        transition-delay: 0.75s;
    }
    
</style>
